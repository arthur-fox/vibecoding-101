<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="name-modal">
    <h2>SNAKE</h2>
    <p id="auth-subtitle">Sign in to save your scores</p>
    <input id="name-input" class="auth-input" type="text" maxlength="16" placeholder="username" autocomplete="username" spellcheck="false">
    <input id="pass-input" class="auth-input" type="password" placeholder="password" autocomplete="current-password">
    <input id="pass-confirm" class="auth-input" type="password" placeholder="confirm password" autocomplete="new-password" style="display:none">
    <p id="auth-error"></p>
    <button class="game-btn" id="name-btn">SIGN IN</button>
    <p id="auth-toggle">New player? <a id="toggle-link">Create account</a></p>
  </div>

  <h1>SNAKE</h1>

  <div id="user-bar">
    <span id="user-name"></span>
    <button id="logout-btn" style="display:none">LOG OUT</button>
  </div>

  <div id="scoreboard">
    SCORE <span id="score">0</span>
    &nbsp;&nbsp;&nbsp;
    BEST <span id="best">0</span>
  </div>

  <div id="canvas-wrap">
    <canvas id="canvas" width="480" height="480"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">SNAKE</h2>
      <p id="overlay-msg">Use arrow keys or WASD to move</p>
      <div id="leaderboard" style="display:none"></div>
      <p id="lb-status"></p>
      <button class="game-btn" id="btn">PLAY</button>
    </div>
  </div>

  <div id="controls">
    ARROW KEYS / WASD &nbsp;·&nbsp; P to pause &nbsp;·&nbsp; R to restart
  </div>

  <script src="game.js"></script>
</body>
</html>
