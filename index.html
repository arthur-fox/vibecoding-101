<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    @property --bg-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes spin-bg {
      to { --bg-angle: 360deg; }
    }

    body {
      background: conic-gradient(
        from var(--bg-angle) at 50% 50%,
        #04041a,
        #0d0521,
        #050e1f,
        #041a18,
        #0a0520,
        #04041a
      );
      animation: spin-bg 24s linear infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #e0e0e0;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 0.3em;
      color: #60a5fa;
      text-shadow: 0 0 20px #60a5fa66;
      margin-bottom: 16px;
    }

    #scoreboard {
      display: flex;
      gap: 48px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      color: #888;
    }

    #scoreboard span { color: #e0e0e0; font-size: 1.1rem; }

    #canvas-wrap {
      position: relative;
      width: min(480px, calc(100vw - 32px));
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 2px solid #1e1e2e;
      border-radius: 4px;
      box-shadow: 0 0 40px #60a5fa22;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 28px 24px 20px;
      overflow-y: auto;
      background: rgba(10, 10, 15, 0.88);
      border-radius: 4px;
    }

    #overlay h2 {
      font-size: 1.8rem;
      color: #60a5fa;
      text-shadow: 0 0 20px #60a5fa88;
      margin-bottom: 4px;
      letter-spacing: 0.1em;
    }

    #overlay-msg {
      color: #888;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }

    .game-btn {
      background: #60a5fa;
      color: #0a0a0f;
      border: none;
      padding: 10px 28px;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: bold;
      letter-spacing: 0.15em;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 14px;
    }

    .game-btn:hover { background: #93c5fd; transform: scale(1.04); }
    .game-btn:active { transform: scale(0.97); }

    #user-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 0.75rem;
      color: #555;
      letter-spacing: 0.05em;
      min-height: 20px;
    }

    #user-bar span { color: #60a5fa; }

    #logout-btn {
      background: none;
      border: 1px solid #333;
      color: #555;
      font-family: inherit;
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 3px;
      cursor: pointer;
      letter-spacing: 0.08em;
      transition: color 0.15s, border-color 0.15s;
    }

    #logout-btn:hover { color: #f87171; border-color: #f87171; }

    #controls {
      margin-top: 16px;
      font-size: 0.75rem;
      color: #444;
      letter-spacing: 0.05em;
      text-align: center;
      line-height: 1.8;
    }

    /* Leaderboard */
    #leaderboard {
      width: 100%;
      margin-top: 4px;
    }

    #leaderboard h3 {
      color: #60a5fa;
      letter-spacing: 0.15em;
      font-size: 0.75rem;
      margin-bottom: 8px;
      text-align: center;
    }

    .lb-row {
      display: flex;
      align-items: center;
      padding: 4px 0;
      font-size: 0.8rem;
      color: #aaa;
      border-bottom: 1px solid #1a1a28;
    }

    .lb-row.me { color: #fbbf24; }
    .lb-row .rank { width: 22px; color: #555; flex-shrink: 0; }
    .lb-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px; }
    .lb-row .pts { color: #60a5fa; flex-shrink: 0; }
    .lb-row.me .pts { color: #fbbf24; }

    #lb-status {
      font-size: 0.75rem;
      color: #555;
      text-align: center;
      margin-top: 6px;
    }

    /* Auth modal */
    #name-modal {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 15, 0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    #name-modal h2 {
      font-size: 1.6rem;
      color: #60a5fa;
      letter-spacing: 0.2em;
      text-shadow: 0 0 20px #60a5fa88;
      margin-bottom: 6px;
    }

    #auth-subtitle {
      color: #555;
      font-size: 0.8rem;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }

    .auth-input {
      background: #13131e;
      border: 1px solid #2a2a3e;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 1rem;
      padding: 10px 16px;
      border-radius: 4px;
      text-align: center;
      letter-spacing: 0.1em;
      outline: none;
      margin-bottom: 10px;
      width: 220px;
      display: block;
    }

    .auth-input:focus { border-color: #60a5fa; }

    #auth-error {
      color: #f87171;
      font-size: 0.78rem;
      min-height: 18px;
      margin-bottom: 4px;
      text-align: center;
    }

    #auth-toggle {
      margin-top: 14px;
      font-size: 0.78rem;
      color: #555;
    }

    #auth-toggle a {
      color: #60a5fa;
      text-decoration: none;
      cursor: pointer;
    }

    #auth-toggle a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div id="name-modal">
    <h2>SNAKE</h2>
    <p id="auth-subtitle">Sign in to save your scores</p>
    <input id="name-input" class="auth-input" type="text" maxlength="16" placeholder="username" autocomplete="username" spellcheck="false">
    <input id="pass-input" class="auth-input" type="password" placeholder="password" autocomplete="current-password">
    <input id="pass-confirm" class="auth-input" type="password" placeholder="confirm password" autocomplete="new-password" style="display:none">
    <p id="auth-error"></p>
    <button class="game-btn" id="name-btn">SIGN IN</button>
    <p id="auth-toggle">New player? <a id="toggle-link">Create account</a></p>
  </div>

  <h1>SNAKE</h1>

  <div id="user-bar">
    <span id="user-name"></span>
    <button id="logout-btn" style="display:none">LOG OUT</button>
  </div>

  <div id="scoreboard">
    SCORE <span id="score">0</span>
    &nbsp;&nbsp;&nbsp;
    BEST <span id="best">0</span>
  </div>

  <div id="canvas-wrap">
    <canvas id="canvas" width="480" height="480"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">SNAKE</h2>
      <p id="overlay-msg">Use arrow keys or WASD to move</p>
      <div id="leaderboard" style="display:none"></div>
      <p id="lb-status"></p>
      <button class="game-btn" id="btn">PLAY</button>
    </div>
  </div>

  <div id="controls">
    ARROW KEYS / WASD &nbsp;·&nbsp; P to pause &nbsp;·&nbsp; R to restart
  </div>

  <script>
    // ── Supabase ──────────────────────────────────────────────────────────────
    const SUPABASE_URL = 'https://tatnwzrbosqbolkojcsn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_mlXEOI9o70fBwVigtBTo9g_yI7RGpSO';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let username = '';
    let authMode = 'signin';

    async function initAuth() {
      const { data: { session } } = await sb.auth.getSession();
      if (session?.user && !session.user.is_anonymous) {
        currentUser = session.user;
        username = session.user.user_metadata?.username || lsGet('snake-username', '');
        document.getElementById('name-modal').style.display = 'none';
        showUserBar(username);
      }
    }

    function toEmail(name) {
      return `${name.toLowerCase().replace(/[^a-z0-9]/g, '')}@snake.game`;
    }

    function setAuthError(msg) {
      document.getElementById('auth-error').textContent = msg;
    }

    async function handleAuth() {
      const name = document.getElementById('name-input').value.trim();
      const pass = document.getElementById('pass-input').value;
      if (!name || !pass) { setAuthError('Please fill in all fields.'); return; }

      const btn = document.getElementById('name-btn');
      btn.textContent = '...';
      setAuthError('');

      const email = toEmail(name);

      if (authMode === 'signup') {
        const confirm = document.getElementById('pass-confirm').value;
        if (pass !== confirm) { setAuthError('Passwords do not match.'); btn.textContent = 'CREATE ACCOUNT'; return; }
        if (pass.length < 6)  { setAuthError('Password must be at least 6 characters.'); btn.textContent = 'CREATE ACCOUNT'; return; }

        const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { username: name } } });
        if (error) { setAuthError(error.message); btn.textContent = 'CREATE ACCOUNT'; return; }
        currentUser = data.user;
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
        if (error) { setAuthError('Incorrect username or password.'); btn.textContent = 'SIGN IN'; return; }
        currentUser = data.user;
      }

      username = currentUser.user_metadata?.username || name;
      lsSet('snake-username', username);
      document.getElementById('name-modal').style.display = 'none';
      showUserBar(username);
    }

    function showUserBar(name) {
      document.getElementById('user-name').textContent = name;
      document.getElementById('logout-btn').style.display = 'inline-block';
    }

    async function logout() {
      await sb.auth.signOut();
      currentUser = null;
      username = '';
      lsSet('snake-username', '');
      document.getElementById('user-name').textContent = '';
      document.getElementById('logout-btn').style.display = 'none';
      document.getElementById('name-modal').style.display = 'flex';
      authMode = 'signin';
      document.getElementById('name-btn').textContent = 'SIGN IN';
      document.getElementById('auth-subtitle').textContent = 'Sign in to save your scores';
      document.getElementById('pass-confirm').style.display = 'none';
      document.getElementById('toggle-link').textContent = 'Create account';
      document.getElementById('auth-toggle').firstChild.textContent = 'New player? ';
      setAuthError('');
      document.getElementById('name-input').value = '';
      document.getElementById('pass-input').value = '';
    }

    async function saveAndFetchLeaderboard(myScore) {
      if (!currentUser) return null;
      const lbEl = document.getElementById('leaderboard');
      const statusEl = document.getElementById('lb-status');
      lbEl.innerHTML = '<h3>LEADERBOARD</h3>';
      lbEl.style.display = 'block';
      statusEl.textContent = 'Saving score...';

      try {
        await sb.from('scores').insert({ user_id: currentUser.id, username, score: myScore });
        statusEl.textContent = '';
        const { data, error } = await sb.from('scores')
          .select('username, score')
          .order('score', { ascending: false })
          .limit(10);
        if (error) throw error;

        lbEl.innerHTML = '<h3>LEADERBOARD</h3>' + (data || []).map((r, i) => {
          const isMe = r.username === username && r.score === myScore;
          return `<div class="lb-row${isMe ? ' me' : ''}">
            <span class="rank">${i + 1}</span>
            <span class="name">${r.username}</span>
            <span class="pts">${r.score}</span>
          </div>`;
        }).join('');
      } catch {
        statusEl.textContent = 'Could not load leaderboard.';
      }
    }

    // ── Auth modal ─────────────────────────────────────────────────────────────
    document.getElementById('name-btn').addEventListener('click', handleAuth);
    document.getElementById('logout-btn').addEventListener('click', logout);

    document.getElementById('toggle-link').addEventListener('click', () => {
      authMode = authMode === 'signin' ? 'signup' : 'signin';
      const isSignup = authMode === 'signup';
      document.getElementById('pass-confirm').style.display = isSignup ? 'block' : 'none';
      document.getElementById('name-btn').textContent    = isSignup ? 'CREATE ACCOUNT' : 'SIGN IN';
      document.getElementById('auth-subtitle').textContent = isSignup ? 'Create your account' : 'Sign in to save your scores';
      document.getElementById('toggle-link').textContent  = isSignup ? 'Sign in instead' : 'Create account';
      document.getElementById('auth-toggle').firstChild.textContent = isSignup ? 'Already have an account? ' : 'New player? ';
      setAuthError('');
    });

    ['name-input', 'pass-input', 'pass-confirm'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') handleAuth();
      });
    });

    // ── Game ──────────────────────────────────────────────────────────────────
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg   = document.getElementById('overlay-msg');
    const btn          = document.getElementById('btn');
    const scoreEl      = document.getElementById('score');
    const bestEl       = document.getElementById('best');

    const COLS = 20, ROWS = 20;
    const CELL = canvas.width / COLS;
    const TICK_BASE = 150;
    const TICK_MIN  = 60;
    const POWER_UP_BOOST    = 40;
    const POWER_UP_DURATION = 3000;

    let snake, dir, nextDir, food, score, best, state, tickInterval, tick;
    let powerUp, boosted, boostTimeout, foodCount, nextPowerUpAt;

    function lsGet(k, fb) { try { return localStorage.getItem(k) ?? fb; } catch { return fb; } }
    function lsSet(k, v)  { try { localStorage.setItem(k, v); } catch {} }

    best = parseInt(lsGet('snake-best', '0'));
    bestEl.textContent = best;

    function rand(n) { return Math.floor(Math.random() * n); }

    function spawnFood(body) {
      let pos;
      do { pos = { x: rand(COLS), y: rand(ROWS) }; }
      while (body.some(s => s.x === pos.x && s.y === pos.y));
      return pos;
    }

    function init() {
      const mid = Math.floor(COLS / 2);
      snake   = [{ x: mid, y: 10 }, { x: mid, y: 11 }, { x: mid, y: 12 }];
      dir     = { x: 0, y: -1 };
      nextDir = { x: 0, y: -1 };
      score   = 0;
      scoreEl.textContent = 0;
      food    = spawnFood(snake);
      powerUp = null;
      boosted = false;
      if (boostTimeout) { clearTimeout(boostTimeout); boostTimeout = null; }
      foodCount    = 0;
      nextPowerUpAt = 3 + rand(3);
      tick = 0;
    }

    function tickSpeed() { return Math.max(TICK_MIN, TICK_BASE - Math.floor(score / 5) * 8); }
    function boostedTickSpeed() { return Math.max(40, tickSpeed() - POWER_UP_BOOST); }

    function activateBoost() {
      boosted = true;
      if (boostTimeout) clearTimeout(boostTimeout);
      clearInterval(tickInterval);
      tickInterval = setInterval(gameLoop, boostedTickSpeed());
      boostTimeout = setTimeout(() => {
        boosted = false;
        boostTimeout = null;
        clearInterval(tickInterval);
        tickInterval = setInterval(gameLoop, tickSpeed());
      }, POWER_UP_DURATION);
    }

    function spawnPowerUp(body) {
      foodCount++;
      if (foodCount < nextPowerUpAt || powerUp) return;
      foodCount = 0;
      nextPowerUpAt = 3 + rand(3);
      let pos;
      do { pos = { x: rand(COLS), y: rand(ROWS) }; }
      while (body.some(s => s.x === pos.x && s.y === pos.y) || (pos.x === food.x && pos.y === food.y));
      powerUp = pos;
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
      if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

      snake.unshift(head);
      let ate = false;

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        if (score > best) { best = score; bestEl.textContent = best; lsSet('snake-best', best); }
        food = spawnFood(snake);
        if (!boosted) { clearInterval(tickInterval); tickInterval = setInterval(gameLoop, tickSpeed()); }
        spawnPowerUp(snake);
        ate = true;
      } else if (powerUp && head.x === powerUp.x && head.y === powerUp.y) {
        score += 3;
        scoreEl.textContent = score;
        if (score > best) { best = score; bestEl.textContent = best; lsSet('snake-best', best); }
        powerUp = null;
        activateBoost();
        ate = true;
      }

      if (!ate) snake.pop();
      tick++;
      draw();
    }

    function gameLoop() { if (state === 'playing') step(); }

    function gameOver() {
      state = 'over';
      clearInterval(tickInterval);
      drawDead();

      overlayTitle.textContent = 'GAME OVER';
      overlayMsg.textContent   = `Score: ${score}`;
      document.getElementById('leaderboard').style.display = 'none';
      document.getElementById('lb-status').textContent = '';
      btn.textContent = 'PLAY AGAIN';
      overlay.style.display = 'flex';
      overlay.scrollTop = 0;

      saveAndFetchLeaderboard(score);
    }

    function startGame() {
      init();
      state = 'playing';
      overlay.style.display = 'none';
      clearInterval(tickInterval);
      tickInterval = setInterval(gameLoop, tickSpeed());
      draw();
    }

    btn.addEventListener('click', startGame);

    document.addEventListener('keydown', e => {
      const key = e.key;
      if (key === 'r' || key === 'R') { startGame(); return; }

      if (key === 'p' || key === 'P') {
        if (state === 'playing') {
          state = 'paused';
          clearInterval(tickInterval);
          overlayTitle.textContent = 'PAUSED';
          overlayMsg.textContent   = 'Press P or click to resume';
          document.getElementById('leaderboard').style.display = 'none';
          document.getElementById('lb-status').textContent = '';
          btn.textContent = 'RESUME';
          overlay.style.display = 'flex';
        } else if (state === 'paused') {
          state = 'playing';
          overlay.style.display = 'none';
          tickInterval = setInterval(gameLoop, tickSpeed());
        }
        return;
      }

      const map = {
        ArrowUp:    { x: 0, y: -1 }, ArrowDown:  { x: 0, y: 1 },
        ArrowLeft:  { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
        w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
        s: { x: 0, y:  1 }, S: { x: 0, y:  1 },
        a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
        d: { x:  1, y: 0 }, D: { x:  1, y: 0 },
      };

      const newDir = map[key];
      if (!newDir) return;
      if (newDir.x === -dir.x && newDir.y === -dir.y) return;
      nextDir = newDir;
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(key)) e.preventDefault();
    });

    // ── Drawing ───────────────────────────────────────────────────────────────
    function draw() {
      ctx.fillStyle = '#0d0d14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawGrid(); drawFood(); drawPowerUp(); drawSnake();
    }

    function drawGrid() {
      ctx.strokeStyle = '#13131e';
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
      }
    }

    function drawFood() {
      const x = food.x * CELL + CELL / 2, y = food.y * CELL + CELL / 2, r = CELL * 0.35;
      const grd = ctx.createRadialGradient(x, y, 0, x, y, r * 2);
      grd.addColorStop(0, '#f87171aa'); grd.addColorStop(1, 'transparent');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(x, y, r * 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f87171';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath(); ctx.arc(x - r * 0.25, y - r * 0.25, r * 0.35, 0, Math.PI * 2); ctx.fill();
    }

    function drawPowerUp() {
      if (!powerUp) return;
      const x = powerUp.x * CELL + CELL / 2, y = powerUp.y * CELL + CELL / 2, r = CELL * 0.35;
      const pulse = 1 + 0.15 * Math.sin(tick * 0.3);
      const grd = ctx.createRadialGradient(x, y, 0, x, y, r * 2.5);
      grd.addColorStop(0, '#fbbf24cc'); grd.addColorStop(1, 'transparent');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(x, y, r * 2.5, 0, Math.PI * 2); ctx.fill();
      const s = r * pulse;
      ctx.fillStyle = '#fbbf24'; ctx.shadowColor = '#fbbf2488'; ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(x, y - s); ctx.lineTo(x + s, y); ctx.lineTo(x, y + s); ctx.lineTo(x - s, y);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
    }

    function drawSnake(dead = false) {
      snake.forEach((seg, i) => {
        const t = i / snake.length, isHead = i === 0;
        const x = seg.x * CELL + 1, y = seg.y * CELL + 1, w = CELL - 2, h = CELL - 2;

        if (dead) {
          ctx.fillStyle = isHead ? '#666' : `rgba(80,80,80,${0.9 - t * 0.5})`;
          ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
        } else if (boosted) {
          const hue = (tick * 8 + i * (360 / Math.max(snake.length, 1))) % 360;
          ctx.fillStyle = `hsl(${hue},100%,60%)`;
          ctx.shadowColor = `hsl(${hue},100%,60%)`; ctx.shadowBlur = isHead ? 14 : 6;
        } else if (isHead) {
          ctx.fillStyle = '#60a5fa'; ctx.shadowColor = '#60a5fa88'; ctx.shadowBlur = 12;
        } else {
          const blue = Math.round(200 - t * 60);
          ctx.fillStyle = `rgba(50,100,${blue},${0.95 - t * 0.3})`;
          ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
        }

        roundRect(ctx, x, y, w, h, 4); ctx.fill();
      });
      ctx.shadowBlur = 0;
    }

    function drawDead() {
      ctx.fillStyle = '#0d0d14'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawGrid(); drawFood(); drawPowerUp(); drawSnake(true);
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // ── Boot ──────────────────────────────────────────────────────────────────
    init();
    draw();
    initAuth();
  </script>
